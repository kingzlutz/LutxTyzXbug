<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUXO WEBSITE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            background-color: #0a0a12;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 15px #00ff41;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px #00ff41;
        }
        
        .url {
            color: #00aaff;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .status {
            color: #00ff41;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .status:before {
            content: "● ";
            color: #00ff41;
        }
        
        .input-prompt {
            margin-bottom: 20px;
        }
        
        .menu {
            list-style-type: none;
            padding: 0;
            margin-bottom: 30px;
        }
        
        .menu li {
            padding: 5px 0;
            border-bottom: 1px dashed #00ff41;
        }
        
        .footer {
            text-align: right;
            font-size: 12px;
            color: #00ff41;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        
        /* Cyberpunk glitch effects */
        .glitch {
            position: relative;
        }
        
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .glitch::before {
            color: #ff00ff;
            z-index: -1;
            animation: glitch-effect 3s infinite;
        }
        
        .glitch::after {
            color: #00ffff;
            z-index: -2;
            animation: glitch-effect 2s infinite reverse;
        }
        
        @keyframes glitch-effect {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        /* Scanlines effect */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                rgba(0, 255, 65, 0.05) 1px,
                transparent 1px
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title glitch" data-text="FLUXO WEBSITE">FLUXO WEBSITE</div>
            <div class="url">http://fluxo-website.net:2001</div>
        </div>
        
        <div class="status">CONNECTED</div>
        
        <div class="input-prompt">
            Please input target number, example : 62xx
        </div>
        
        <ul class="menu">
            <li>SELECT BUG</li>
            <li>CRASH BETA DELETE</li>
            <li>INVISIBLE IPHONE</li>
            <li>BETA CRASH</li>
            <li>DELAY INVISIBLE</li>
        </ul>
        
        <div class="footer">
            GUTSXYZZ<br>
            <span id="datetime"></span>
        </div>
    </div>

    <script>
        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            }).replace(/\//g, '-');
            
            const timeStr = now.toLocaleTimeString('en-GB', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            document.getElementById('datetime').textContent = `${dateStr}, ${timeStr}`;
        }
        
        updateDateTime();
        setInterval(updateDateTime, 1000);
        
        // Add terminal-like typing effect
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.input-prompt, .menu li');
            let delay = 0;
            
            elements.forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.5s ease-in';
                    el.style.opacity = '1';
                }, delay);
                delay += 200;
            });
        });
    </script>
</body>
</html>
