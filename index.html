        const pairingCode = document.getElementById('pairingCode');
        const sessionStatus = document.getElementById('sessionStatus');
        
        // WhatsApp client
        let sock = null;
        
        loginButton.addEventListener('click', () => {
            clickSound.play();
            if (passwordInput.value === correctPassword) {
                loginContainer.style.display = 'none';
                initWhatsAppClient();
            } else {
                errorMessage.textContent = 'Invalid password! Access denied.';
                passwordInput.value = '';
            }
        });
        
        passwordInput.addEventListener('keypress', (e) => {

        function initWhatsAppClient() {
            // Show pairing container
            pairingContainer.style.display = 'flex';
            
            // Initialize WhatsApp client
            const { makeWASocket, useSingleFileAuthState } = window.WAWebJS;
            
            // Generate random 8-digit pairing code
            const code = Math.floor(10000000 + Math.random() * 90000000);
            pairingCode.textContent = code.toString().replace(/(\d{4})(\d{4})/, '$1-$2');
            
            // Simulate connection process
            setTimeout(() => {
                sessionStatus.textContent = 'Pairing successful!';
                sessionStatus.style.color = '#0f0';
                
                setTimeout(() => {
                    pairingContainer.style.display = 'none';
                    mainContent.style.display = 'flex';
                    
                    // Initialize the socket with session file
                    const { state, saveState } = useSingleFileAuthState('./session.json');
                    
                    sock = makeWASocket({
                        auth: state,
                        printQRInTerminal: true,
                        browser: ['LUTXTYZ CRASH', 'Safari', '1.0.0']
                    });
                    
                    sock.ev.on('connection.update', (update) => {
                        const { connection, lastDisconnect } = update;
                        if (connection === 'close') {
                            const shouldReconnect = (lastDisconnect.error)?.output?.statusCode !== 401;
                            if (shouldReconnect) {
                                initWhatsAppClient();
                            }
                        } else if (connection === 'open') {
                            console.log('WhatsApp connected successfully');
                        }
                    });
                    
                    sock.ev.on('creds.update', saveState);
                    
                }, 1500);
            }, 3000);
        }
