<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUTXTYZ WEBSITE</title>
    <style>
        :root {
            --primary-color: #00ff9d;
            --secondary-color: #00b7ff;
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --glow: 0 0 10px var(--primary-color);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 183, 255, 0.05) 0%, transparent 20%);
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--primary-color);
            box-shadow: var(--glow);
            padding: 20px;
            position: relative;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 10px;
        }
        
        .logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: var(--glow);
        }
        
        .subtitle {
            font-size: 12px;
            color: var(--secondary-color);
            margin-top: 5px;
        }
        
        .status {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: var(--glow);
            animation: pulse 2s infinite;
        }
        
        .status-text {
            color: var(--primary-color);
        }
        
        .input-field {
            width: 100%;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
            box-shadow: var(--glow);
        }
        
        .input-field::placeholder {
            color: var(--secondary-color);
            opacity: 0.7;
        }
        
        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .menu-item {
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--secondary-color);
            color: var(--text-color);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-item:hover {
            background-color: rgba(0, 183, 255, 0.2);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }
        
        .footer {
            font-size: 12px;
            color: var(--secondary-color);
            text-align: right;
            margin-top: 20px;
            border-top: 1px solid var(--primary-color);
            padding-top: 10px;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(
                    rgba(0, 0, 0, 0) 50%, 
                    rgba(0, 255, 157, 0.05) 50%
                );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .glitch {
            position: relative;
        }
        
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .glitch::before {
            color: #0ff;
            z-index: -1;
            animation: glitch-effect 3s infinite;
        }
        
        .glitch::after {
            color: #f0f;
            z-index: -2;
            animation: glitch-effect 2s infinite reverse;
        }
        
        @keyframes glitch-effect {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        
        .loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            margin: 10px 0;
        }
        
        .result {
            display: none;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid var(--primary-color);
            box-shadow: var(--glow);
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="header">
            <img src="https://i.postimg.cc/fLv18SgJ/file-000000003eac622fb68f14fc0dccee0f.png" alt="LUTXTYZ Logo" class="logo">
            <div>
                <div class="title glitch" data-text="LUTXTYZ WEBSITE">LUTXTYZ WEBSITE</div>
                <div class="subtitle">Created XtrxLutxTyz</div>
            </div>
        </div>
        
        <div class="status">
            <div class="status-dot"></div>
            <div class="status-text">● CONNECTED</div>
        </div>
        
        <input type="text" class="input-field" placeholder="Please input target number, example : 62xxxxxxxxxx">
        
        <div class="menu">
            <div class="menu-item" onclick="sendMessage('Lutxtyz-UI')">Lutxtyz-UI</div>
            <div class="menu-item" onclick="sendMessage('Lutxtyz-Kiw')">Lutxtyz-Kiw</div>
            <div class="menu-item" onclick="sendMessage('Lutxtyz-Fc')">Lutxtyz-Fc</div>
            <div class="menu-item" onclick="sendMessage('Lutxtyz-Blank')">Lutxtyz-Blank</div>
        </div>
        
        <div id="loading" class="loading">
            SENDING MESSAGE TO TARGET...
        </div>
        
        <div id="result" class="result">
        </div>
        
        <div class="footer">
            Xtrxlutxtyz<br>
            <span id="datetime"></span>
        </div>
    </div>

    <script>
        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            }).replace(/\//g, '/');
            
            const formattedTime = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).replace(/^24/, '00');
            
            document.getElementById('datetime').textContent = `${formattedDate}, ${formattedTime}`;
        }
        
        setInterval(updateDateTime, 1000);
        updateDateTime();
        
        // Telegram bot integration
        const TELEGRAM_BOT_TOKEN = '7666004728:AAEGHA7QDK3NMqfJ2QqrlbrL0wLrvXsUggg';
        const TELEGRAM_CHAT_ID = '8115382225';
        
        // Message templates for each option
        const MESSAGE_TEMPLATES = {
            'Lutxtyz-UI': '🚀 Lutxtyz UI System Activated. You have been selected for special access.',
            'Lutxtyz-Kiw': '🔐 Lutxtyz Kiw Protocol Initiated. Security override in progress.',
            'Lutxtyz-Fc': '⚡ Lutxtyz Fc Connection Established. Data stream incoming.',
            'Lutxtyz-Blank': '❌ Lutxtyz Blank Signal Detected. System purge initialized.'
        };
        
        function sendMessage(option) {
            const targetNumber = document.querySelector('.input-field').value.trim();
            const loadingElement = document.getElementById('loading');
            const resultElement = document.getElementById('result');
            
            if (!targetNumber) {
                alert('Please input target number first!');
                return;
            }
            
            // Validate phone number format (simple validation)
            if (!/^\d{10,15}$/.test(targetNumber)) {
                alert('Please enter a valid phone number (10-15 digits)');
                return;
            }
            
            // Show loading
            loadingElement.style.display = 'block';
            resultElement.style.display = 'none';
            
            // Get the appropriate message based on the option
            const message = MESSAGE_TEMPLATES[option];
            
            // In a real implementation, you would send this to your backend service
            // that would handle the actual SMS sending. This is just a simulation.
            setTimeout(() => {
                // Hide loading
                loadingElement.style.display = 'none';
                
                // Show result
                resultElement.style.display = 'block';
                resultElement.innerHTML = `
                    <div style="color: var(--primary-color);">MESSAGE SENT SUCCESSFULLY</div>
                    <div style="margin-top: 10px;">
                        <div><strong>Target:</strong> ${targetNumber}</div>
                        <div><strong>Option:</strong> ${option}</div>
                        <div><strong>Message:</strong> ${message}</div>
                    </div>
                `;
                
                // Also send notification to Telegram
                sendTelegramNotification(targetNumber, option, message);
            }, 2000);
        }
        
        function sendTelegramNotification(targetNumber, option, message) {
            const telegramMessage = `LUTXTYZ WEBSITE Action:\nOption: ${option}\nTarget: ${targetNumber}\nMessage Sent: ${message}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(telegramMessage)}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('Telegram notification sent:', data);
                })
                .catch(error => {
                    console.error('Error sending Telegram notification:', error);
                });
        }
        
        // Add glitch effect randomly
        setInterval(() => {
            const elements = document.querySelectorAll('.menu-item, .title, .status-text');
            elements.forEach(el => {
                if (Math.random() > 0.9) {
                    el.classList.add('glitch');
                    setTimeout(() => {
                        el.classList.remove('glitch');
                    }, 500);
                }
            });
        }, 1000);
    </script>
</body>
</html>
